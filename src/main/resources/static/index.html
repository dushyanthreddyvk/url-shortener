<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app-shell">
    <section class="panel">
        <div class="header">
            <p class="eyebrow">Spring Boot + MySQL</p>
            <h1>URL Shortener</h1>
        </div>

        <form id="shortenForm" class="form-row">
            <input id="longUrl" type="url" placeholder="https://example.com/very/long/url" required>
            <button type="submit">Generate</button>
        </form>

        <div id="result" class="result hidden"></div>
    </section>

    <section class="grid">
        <div class="panel">
            <h2>Redirect Test</h2>
            <div class="form-row compact">
                <input id="redirectCode" type="text" placeholder="Short code">
                <button id="redirectButton" type="button">Open</button>
            </div>
        </div>

        <div class="panel">
            <h2>Click Analytics</h2>
            <div class="form-row compact">
                <input id="analyticsCode" type="text" placeholder="Short code">
                <button id="analyticsButton" type="button">Fetch</button>
            </div>
            <div id="analytics" class="analytics hidden"></div>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
